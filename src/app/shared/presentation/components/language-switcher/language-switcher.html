<mat-button-toggle-group [value]="currentLang"
                         appearance="standard"
                         [attr.aria-label]="'language.label' | translate"
                         name="language">

  @for (language of languages; track language) {
    <mat-button-toggle [value]="language"
                       [aria-label]="'language.' + language | translate"
                       (click)="useLanguage(language)">
      {{ 'language.short.' + language | translate }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
