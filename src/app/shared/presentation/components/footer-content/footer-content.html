<footer>
  <p>&copy; {{ currentYear }} MaquiControl. {{ 'footer.rights' | translate }}</p>
  <p>{{ 'footer.developed-by' | translate }} AndesHeavyTech</p>
  <p>{{ 'footer.tagline' | translate }}</p>
  <p><a routerLink="/terms">{{ 'footer.terms' | translate }}</a></p>
  <p>
    {{ 'footer.powered-by' | translate }}
    <a href="https://material.angular.dev/" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'Angular Material ' + ('footer.new-tab' | translate)">Angular Material</a>
    {{ 'footer.and' | translate }}
    <a href="https://ngx-translate.org/" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'ngx-translate ' + ('footer.new-tab' | translate)">ngx-translate</a>
  </p>
</footer>
