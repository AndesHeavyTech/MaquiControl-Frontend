<section class="form-screen">
  <form class="form-card" [formGroup]="form" (ngSubmit)="performSave()">
    <span class="eyebrow">Fleet Management</span>
    <h1>{{ editingId ? 'Editar maquinaria' : 'Publicar maquinaria' }}</h1>

    <label for="categoryId">Categoría</label>
    <select id="categoryId" formControlName="categoryId">
      <option [ngValue]="null" disabled>Selecciona una categoría</option>
      @for (category of store.categories(); track category.id) {
        <option [ngValue]="category.id">{{ category.name }}</option>
      }
    </select>

    <label for="name">Nombre</label>
    <input id="name" type="text" formControlName="name" />

    <label for="description">Descripción</label>
    <textarea id="description" rows="3" formControlName="description"></textarea>

    <label for="type">Tipo</label>
    <select id="type" formControlName="type">
      @for (type of machineryTypes; track type) {
        <option [ngValue]="type">{{ type }}</option>
      }
    </select>

    <div class="field-row">
      <div>
        <label for="brand">Marca</label>
        <input id="brand" type="text" formControlName="brand" />
      </div>

      <div>
        <label for="model">Modelo</label>
        <input id="model" type="text" formControlName="model" />
      </div>
    </div>

    <label for="manufactureYear">Año de fabricación</label>
    <input id="manufactureYear" type="number" formControlName="manufactureYear" />

    <div class="field-row">
      <div>
        <label for="amount">Tarifa por hora</label>
        <input id="amount" type="number" min="0" formControlName="amount" />
      </div>

      <div>
        <label for="currency">Moneda</label>
        <select id="currency" formControlName="currency">
          @for (currency of currencies; track currency) {
            <option [ngValue]="currency">{{ currency }}</option>
          }
        </select>
      </div>
    </div>

    <label for="status">Estado</label>
    <select id="status" formControlName="status">
      @for (status of machineryStatuses; track status) {
        <option [ngValue]="status">{{ status }}</option>
      }
    </select>

    <h2>Ubicación</h2>

    <div class="field-row">
      <div>
        <label for="department">Departamento</label>
        <input id="department" type="text" formControlName="department" />
      </div>

      <div>
        <label for="province">Provincia</label>
        <input id="province" type="text" formControlName="province" />
      </div>
    </div>

    <div class="field-row">
      <div>
        <label for="district">Distrito</label>
        <input id="district" type="text" formControlName="district" />
      </div>

      <div>
        <label for="address">Dirección</label>
        <input id="address" type="text" formControlName="address" />
      </div>
    </div>

    @if (store.saveError()) {
      <span class="error-message">{{ store.saveError() }}</span>
    }

    <div class="form-actions">
      <a mat-stroked-button routerLink="/fleet/machinery">Cancelar</a>
      <button mat-flat-button class="submit-action" type="submit" [disabled]="store.saving()">
        {{ store.saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</section>
